name: neo_brutalist_poll_app
description: A Neo-Brutalist polling app with local Hive storage and Riverpod state management.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.13.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1
  dio: ^5.4.3+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  flutter_svg: ^2.0.9
  lottie: ^3.1.2
  responsive_builder: ^0.7.0
  shared_preferences: ^2.3.2
  smooth_page_indicator: ^1.2.0
  password_strength_checker: ^1.5.0
  showcaseview: ^2.0.3
  flutter_spinkit: ^5.2.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/animations/

